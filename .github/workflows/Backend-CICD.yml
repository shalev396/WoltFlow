name: Backend CI/CD

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - "main" # Production deployment
      - "qa" # QA deployment
      - "dev" # Development deployment
    paths:
      - "Server/**"
      - ".github/workflows/Backend-CICD.yml"

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'prod' || github.ref == 'refs/heads/qa' && 'qa' || github.ref == 'refs/heads/dev' && 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Determine environment stage
        id: env-stage
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "stage=prod" >> $GITHUB_OUTPUT
            echo "env_file=.env.prod" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" == "refs/heads/qa" ]; then
            echo "stage=qa" >> $GITHUB_OUTPUT
            echo "env_file=.env.qa" >> $GITHUB_OUTPUT
          else
            echo "stage=dev" >> $GITHUB_OUTPUT
            echo "env_file=.env.dev" >> $GITHUB_OUTPUT
          fi

      - name: Load environment variables
        run: |
          echo '${{ secrets.ENV }}' > ${{ steps.env-stage.outputs.env_file }}
        working-directory: Server

      - name: Export environment variables
        uses: falti/dotenv-action@v1.1.4
        with:
          path: Server/${{ steps.env-stage.outputs.env_file }}
          export-variables: true
          keys-case: bypass
          mask-variables: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/my-github-actions-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install dependencies
        run: npm ci
        working-directory: Server

      - name: Build TypeScript
        run: npm run build
        working-directory: Server

      - name: Deploy to ${{ steps.env-stage.outputs.stage }} stage
        run: npm run deploy:${{ steps.env-stage.outputs.stage }}
        working-directory: Server
        env:
          SERVERLESS_ACCESS_KEY: ${{ env.SERVERLESS_ACCESS_KEY }}
