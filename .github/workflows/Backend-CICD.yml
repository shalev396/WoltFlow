name: Backend CI/CD

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - "main" # Production
      - "dev" # Development
      - "qa" # QA
    paths:
      - "Server/**"
      - ".github/workflows/Backend-CICD.yml"

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'dev' && 'dev' || github.ref_name == 'qa' && 'qa' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set stage
        id: stage
        run: echo "name=${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'dev' && 'dev' || github.ref_name == 'qa' && 'qa' }}" >> $GITHUB_OUTPUT

      - name: Load environment variables
        run: echo '${{ secrets.ENV }}' > .env.${{ steps.stage.outputs.name }}
        working-directory: Server

      - name: Export environment variables
        uses: falti/dotenv-action@v1.1.4
        with:
          path: Server/.env.${{ steps.stage.outputs.name }}
          export-variables: true
          keys-case: bypass
          mask-variables: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/my-github-actions-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install dependencies
        run: npm ci
        working-directory: Server

      - name: Build TypeScript
        run: npm run build
        working-directory: Server

      - name: Deploy to ${{ steps.stage.outputs.name }} stage
        run: npm run deploy:${{ steps.stage.outputs.name }}
        working-directory: Server
        env:
          SERVERLESS_ACCESS_KEY: ${{ env.SERVERLESS_ACCESS_KEY }}
