name: Backend CI/CD

permissions:
  id-token: write
  contents: read

on:
  push:
    branches:
      - "main" # Production
      - "dev" # Development
      - "qa" # QA
    paths:
      - "Server/**"
      - ".github/workflows/Backend-CICD.yml"

jobs:
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'dev' && 'dev' || github.ref_name == 'qa' && 'qa' }}

    env:
      # Non-sensitive configuration from environment variables
      ## Global repository variables
      AWS_REGION: ${{ vars.AWS_REGION }}
      ## Per environment variables
      DEVELOPMENT_DATE: ${{ vars.DEVELOPMENT_DATE }}
      DOMAIN_NAME_CLOUD: ${{ vars.DOMAIN_NAME_CLOUD }}
      EMAIL_SUBDOMAIN: ${{ vars.EMAIL_SUBDOMAIN }}
      ENABLED_SMS: ${{ vars.ENABLED_SMS }}

      # Sensitive data from secrets (automatically masked in logs)
      ## Global repository secrets
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
      CERTIFICATE_ARN: ${{ secrets.CERTIFICATE_ARN }}
      HOSTED_ZONE_ID: ${{ secrets.HOSTED_ZONE_ID }}
      LAMBDA_SECURITY_GROUP_ID: ${{ secrets.LAMBDA_SECURITY_GROUP_ID }}
      LAMBDA_SUBNET_ID: ${{ secrets.LAMBDA_SUBNET_ID }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}

      ## Per environment secrets
      COGNITO_ISSUER: ${{ secrets.COGNITO_ISSUER }}
      COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
      DATABASE_URL_CLOUD: ${{ secrets.DATABASE_URL_CLOUD }}
      DATABASE_URL_LOCAL: ${{ secrets.DATABASE_URL_LOCAL }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      S3_ASSETS_BUCKET_NAME: ${{ secrets.S3_ASSETS_BUCKET_NAME }}
      S3_CLIENT_BUCKET_NAME: ${{ secrets.S3_CLIENT_BUCKET_NAME }}
      S3_EMAIL_BUCKET_NAME: ${{ secrets.S3_EMAIL_BUCKET_NAME }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set stage
        id: stage
        run: echo "name=${{ github.ref_name == 'main' && 'prod' || github.ref_name == 'dev' && 'dev' || github.ref_name == 'qa' && 'qa' }}" >> $GITHUB_OUTPUT

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/my-github-actions-role

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Install dependencies
        run: npm ci
        working-directory: Server

      - name: Build TypeScript
        run: npm run build
        working-directory: Server

      - name: Deploy to ${{ steps.stage.outputs.name }} stage
        run: npm run deploy:${{ steps.stage.outputs.name }}
        working-directory: Server
