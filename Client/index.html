<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WoltFlow</title>
  </head>
  <body>
    <div id="root"></div>
    <footer
      id="fallback-footer"
      style="font-size: 10px; text-align: center; padding: 4px"
    >
      <a href="/privacy-policy.html" aria-label="Privacy Policy"
        >Privacy Policy</a
      >
    </footer>

    <noscript>
      <div style="text-align: center; margin-top: 8px">
        <a href="/privacy-policy.html">Privacy Policy</a> (JavaScript disabled)
      </div>
    </noscript>

    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Remove fallback footer once React loads
      function removeFooterWhenReactLoads() {
        const checkReactLoaded = () => {
          const root = document.getElementById("root");
          const footer = document.getElementById("fallback-footer");

          // Check if React has rendered content in the root
          if (root && root.children.length > 0 && footer) {
            footer.remove();
            return true;
          }
          return false;
        };

        // Try immediately
        if (checkReactLoaded()) return;

        // Use MutationObserver to watch for changes in the root element
        const observer = new MutationObserver(() => {
          if (checkReactLoaded()) {
            observer.disconnect();
          }
        });

        const root = document.getElementById("root");
        if (root) {
          observer.observe(root, {
            childList: true,
            subtree: true,
          });
        }

        // Fallback timeout in case observer doesn't work
        setTimeout(() => {
          checkReactLoaded();
          observer.disconnect();
        }, 5000);
      }

      // Start checking when DOM is ready
      if (document.readyState === "loading") {
        document.addEventListener(
          "DOMContentLoaded",
          removeFooterWhenReactLoads
        );
      } else {
        removeFooterWhenReactLoads();
      }
    </script>
  </body>
</html>
