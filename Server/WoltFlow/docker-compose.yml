services:
  woltflow:
    build: .
    platform: windows
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - DATABASE_URL=${DATABASE_URL}
      - ENV=Production
    volumes:
      - type: bind
        source: ./screenshots
        target: C:/app/screenshots
      - type: bind
        source: ./chrome_profiles
        target: C:/app/chrome_profiles
      - type: bind
        source: ./woltflow.log
        target: C:/app/woltflow.log
    ports:
      - "9222:9222"
    isolation: process
    # restart: unless-stopped
