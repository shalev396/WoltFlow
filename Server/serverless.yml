org: shalev396

app: woltflow

service: woltflow-server

provider:
  name: aws
  runtime: nodejs20.x
  timeout: 30
  region: eu-central-1
  apiGateway:
    shouldStartNameWithService: true
  logs:
    restApi: false
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    DATABASE_URL_DEV: ${env:DATABASE_URL_DEV}
    ENV: ${env:ENV}
    GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID}
    GOOGLE_CLIENT_SECRET: ${env:GOOGLE_CLIENT_SECRET}
    OAUTH_REDIRECT_URI: ${env:OAUTH_REDIRECT_URI}
    JWT_SECRET: ${env:JWT_SECRET}
    IS_OFFLINE: ${env:IS_OFFLINE, "false"}
    DEVELOPMENT_DATE: ${env:DEVELOPMENT_DATE, ""}
    AWS_ACCESS_CONNECT_KEY: ${env:AWS_ACCESS_CONNECT_KEY}
    AWS_ACCESS_SECRET: ${env:AWS_ACCESS_SECRET}
    AWS_REGIONS: ${env:AWS_REGIONS}
    ASSETS_BUCKET_NAME: ${env:ASSETS_BUCKET_NAME}
    REFRESH_TOKENS_FUNCTION_NAME: ${self:service}-${self:provider.stage, 'dev'}-refreshTokens
    WOLT_BUY_GIFT_FUNCTION_NAME: ${self:service}-${self:provider.stage, 'dev'}-woltBuyGift
    GET_DAILY_CODE_FUNCTION_NAME: ${self:service}-${self:provider.stage, 'dev'}-getDailyCode
    WOLT_APPLY_GIFT_FUNCTION_NAME: ${self:service}-${self:provider.stage, 'dev'}-woltApplyGift
    PATH: "/opt/bin:${env:PATH, ''}"
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage, 'dev'}-refreshTokens
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage, 'dev'}-woltBuyGift
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage, 'dev'}-getDailyCode
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage, 'dev'}-woltApplyGift
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
          Resource: "arn:aws:s3:::${env:ASSETS_BUCKET_NAME}/*"

package:
  patterns:
    - "!node_modules/**"
    - "!src/**"
    - "!screenshots/**"
    - "!*.zip"
    - "!.serverless/**"
    - "!layers/**"
    - "!.git/**"
    - "!.build/**"
    - "dist/**"
    - "package.json"
plugins:
  - serverless-offline
  - serverless-dotenv-plugin

useDotenv: true

layers:
  chromedriver:
    path: layers/chromedriver-layer
    name: ${sls:stage}-chromedriver-layer
    description: ChromeDriver layer for Selenium automation
    compatibleRuntimes:
      - nodejs20.x
    compatibleArchitectures:
      - x86_64

  chrome:
    path: layers/chrome-layer
    name: ${sls:stage}-chrome-layer
    description: Headless Chrome layer for Selenium automation
    compatibleRuntimes:
      - nodejs20.x
    compatibleArchitectures:
      - x86_64

functions:
  oauthStart:
    handler: dist/src/handlers/auth/oauthStart.handler
    events:
      - http:
          path: /api/oauth2/start
          method: get
          cors:
            origin: "https://woltflow.shalev396.com"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            methods:
              - GET
              - OPTIONS
  oauthCallback:
    handler: dist/src/handlers/auth/oauthCallback.handler
    events:
      - http:
          path: /api/oauth2/callback
          method: get
          cors:
            origin: "https://woltflow.shalev396.com"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            methods:
              - GET
              - OPTIONS
  authMe:
    handler: dist/src/handlers/auth/authMeHandler.handler
    events:
      - http:
          path: /api/auth/me
          method: get
          cors:
            origin: "https://woltflow.shalev396.com"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            methods:
              - GET
              - OPTIONS
  logout:
    handler: dist/src/handlers/auth/logout.handler
    events:
      - http:
          path: /api/auth/logout
          method: post
          cors:
            origin: "https://woltflow.shalev396.com"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            methods:
              - POST
              - OPTIONS
  getDailyCode:
    handler: dist/src/handlers/gmail/getDailyCode.handler
    events:
      - http:
          path: /api/gmail/daily-code
          method: get
          cors:
            origin: "https://woltflow.shalev396.com"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            methods:
              - GET
              - OPTIONS
  getUserSettings:
    handler: dist/src/handlers/setting/getusersettings.handler
    events:
      - http:
          path: /api/setting
          method: get
          cors:
            origin: "https://woltflow.shalev396.com"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            methods:
              - GET
              - OPTIONS
  setUserSettings:
    handler: dist/src/handlers/setting/setusersettings.handler
    events:
      - http:
          path: /api/setting
          method: post
          cors:
            origin: "https://woltflow.shalev396.com"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            methods:
              - POST
              - OPTIONS
  startAllRuns:
    handler: dist/src/handlers/automation/startAllRuns.handler
    events:
      - http:
          path: /api/automation/start-all-runs
          method: get
          cors:
            origin: "https://woltflow.shalev396.com"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            methods:
              - GET
              - OPTIONS
      - schedule:
          rate: cron(0 10 ? * SUN,MON,TUE,WED,THU *)
          description: "Trigger startAllRuns on weekdays at 10:00 UTC (12:00 Israel time)"
  refreshTokens:
    handler: dist/src/handlers/automation/refreshTokens.handler
    events:
      - http:
          path: /api/wolt/refreshTokens
          method: get
          cors:
            origin: "https://woltflow.shalev396.com"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            methods:
              - GET
              - OPTIONS
  woltBuyGift:
    handler: dist/src/handlers/automation/woltBuyGift.handler
    layers:
      - !Ref ChromedriverLambdaLayer
      - !Ref ChromeLambdaLayer
    memorySize: 1024
    timeout: 70
    events:
      - http:
          path: /api/wolt/buyGift
          method: get
          cors:
            origin: "https://woltflow.shalev396.com"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            methods:
              - GET
              - OPTIONS
  woltApplyGift:
    handler: dist/src/handlers/automation/woltApplyGift.handler
    layers:
      - !Ref ChromedriverLambdaLayer
      - !Ref ChromeLambdaLayer
    memorySize: 1024
    timeout: 60
    events:
      - http:
          path: /api/wolt/applyGift
          method: get
          cors:
            origin: "https://woltflow.shalev396.com"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            methods:
              - GET
              - OPTIONS
  getUserRuns:
    handler: dist/src/handlers/runs/getUserRuns.handler
    events:
      - http:
          path: /api/runs
          method: get
          cors:
            origin: "https://woltflow.shalev396.com"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            methods:
              - GET
              - OPTIONS

custom:
  serverless-offline:
    # host: 127.0.0.1 # ← Force Hapi to bind here instead of 'localhost'
    httpPort: 3000
    lambdaPort: 3002
    noPrependStageInUrl: true
    reloadHandler: true
    disableCookieValidation: true # ← Disables strictHeader cookie validation in Hapi
    enforceSecureCookies: false # ← Ensures Hapi won't require HTTPS for cookies
    printOutput: true
# TypeScript plugin removed temporarily
