# ================================
# WOLTFLOW SERVERLESS CONFIGURATION
# ================================
#
# This serverless.yml configures a complete serverless application with:
# - Lambda functions for API endpoints
# - S3 buckets for client files and assets
# - CloudFront distribution for global CDN
# - Route 53 for custom domain routing
#
# DEPLOYMENT NOTES:
# 1. SSL Certificates - CREATE MANUALLY in ACM (us-east-1 region):
#    - Create certificate for dev.woltflow.shalev396.com (add ARN to CERTIFICATE_ARN_DEV)
#    - Create certificate for woltflow.shalev396.com (add ARN to CERTIFICATE_ARN_PROD)
# 2. Ensure you have a Route 53 hosted zone for shalev396.com
# 3. Deploy stages separately:
#    - DEV:  serverless deploy --stage dev  (creates dev.woltflow.shalev396.com)
#    - PROD: serverless deploy --stage prod (creates woltflow.shalev396.com)
# 4. Each stage gets its own complete infrastructure:
#    - Separate CloudFront distributions with custom domains
#    - Separate S3 buckets
#    - Separate API Gateways
#    - Separate Route 53 records
#    - Uses manually created SSL certificates
# 5. After deployment, upload your React build files to the stage-specific client bucket
# 6. Upload assets/images to the stage-specific assets bucket under the /images/ path
# 7. Both dev and prod use custom domains with manually created SSL certificates!
#
# ================================

org: shalev396

app: woltflow

service: woltflow-server

frameworkVersion: ^4.0.0

provider:
  name: aws
  # versionFunctions: false
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  timeout: 30
  memorySize: 160
  region: il-central-1
  apiGateway:
    shouldStartNameWithService: true
  logs:
    restApi: false
  environment:
    # Environment Configuration
    ENV: ${opt:stage, 'local'}

    # Database Configuration
    DATABASE_URL_LOCAL: ${env:DATABASE_URL_LOCAL}
    DATABASE_URL_DEV: ${env:DATABASE_URL_DEV}
    DATABASE_URL_PROD: ${env:DATABASE_URL_PROD}

    # Google OAuth Configuration
    GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID}
    GOOGLE_CLIENT_SECRET: ${env:GOOGLE_CLIENT_SECRET}
    OAUTH_REDIRECT_URI_LOCAL: ${env:OAUTH_REDIRECT_URI_LOCAL}
    OAUTH_REDIRECT_URI_DEV: ${env:OAUTH_REDIRECT_URI_DEV}
    OAUTH_REDIRECT_URI_PROD: ${env:OAUTH_REDIRECT_URI_PROD}

    # JWT Configuration
    JWT_SECRET: ${env:JWT_SECRET}
    DEVELOPMENT_DATE: ${env:DEVELOPMENT_DATE, ""}

    # AWS Configuration - AWS_REGION is automatically provided by AWS Lambda

    # S3 Bucket Configuration
    S3_ASSETS_BUCKET_NAME_DEV: ${env:S3_ASSETS_BUCKET_NAME_DEV}
    S3_ASSETS_BUCKET_NAME_PROD: ${env:S3_ASSETS_BUCKET_NAME_PROD}

    # Lambda Function Names
    REFRESH_TOKENS_FUNCTION_NAME: ${self:service}-${self:provider.stage, 'local'}-refreshTokens
    WOLT_BUY_GIFT_FUNCTION_NAME: ${self:service}-${self:provider.stage, 'local'}-woltBuyGift
    GET_DAILY_CODE_FUNCTION_NAME: ${self:service}-${self:provider.stage, 'local'}-getDailyCode
    WOLT_APPLY_GIFT_FUNCTION_NAME: ${self:service}-${self:provider.stage, 'local'}-woltApplyGift

    # CloudFront and Domain Configuration (Stage-specific)
    DOMAIN_NAME: ${self:custom.domainName.${self:provider.stage}}
    CLIENT_BUCKET_NAME: ${self:custom.clientBucketName.${self:provider.stage}}
    ASSETS_BUCKET_NAME_NEW: ${self:custom.assetsBucketName.${self:provider.stage}}
    HOSTED_ZONE_ID: ${env:HOSTED_ZONE_ID} # Route 53 hosted zone ID
    CERTIFICATE_ARN_DEV: ${env:CERTIFICATE_ARN_DEV} # ACM certificate ARN
    CERTIFICATE_ARN_PROD: ${env:CERTIFICATE_ARN_PROD} # ACM certificate ARN

  ecr:
    images:
      woltflow-selenium-image:
        path: ./
        file: Dockerfile
  iam:
    role:
      statements:
        # Lambda Invocation Permissions
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage, 'local'}-refreshTokens
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage, 'local'}-woltBuyGift
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage, 'local'}-getDailyCode
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage, 'local'}-woltApplyGift

        # S3 Permissions for all buckets
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:PutObjectAcl
          Resource:
            - "arn:aws:s3:::${self:custom.clientBucketName.${self:provider.stage}}/*"
            - "arn:aws:s3:::${self:custom.assetsBucketName.${self:provider.stage}}/*"

        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - "arn:aws:s3:::${self:custom.clientBucketName.${self:provider.stage}}"
            - "arn:aws:s3:::${self:custom.assetsBucketName.${self:provider.stage}}"

        # ECR Permissions
        - Effect: Allow
          Action: ecr:GetAuthorizationToken
          Resource: "*"
        - Effect: Allow
          Action:
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchGetImage
            - ecr:InitiateLayerUpload
            - ecr:UploadLayerPart
            - ecr:CompleteLayerUpload
            - ecr:PutImage
          Resource: "*"

        # CloudFront Permissions
        - Effect: Allow
          Action:
            - cloudfront:CreateInvalidation
            - cloudfront:GetInvalidation
            - cloudfront:ListInvalidations
          Resource: "*"

# Package Configuration
package:
  # individually: true
  excludeDevDependencies: true
  patterns:
    # Exclude source and development files
    - "!src/**"
    - "!.serverless/**"
    - "!tsconfig.json"
    - "!*.md"
    - "!screenshots/**"
    - "!undefined/**"
    - "!*.zip"
    - "!.env*"
    - "!.dockerignore"
    - "!Dockerfile"
    - "!patches/**"
    - "!woltBuyGift.json"

    # Exclude AWS SDK - Lambda runtime provides it
    - "!node_modules/aws-sdk/**"

    # Exclude large dev dependencies that might slip through
    - "!node_modules/typescript/**"
    - "!node_modules/@types/**"
    - "!node_modules/@esbuild/**"
    - "!node_modules/webpack/**"
    - "!node_modules/serverless/**"

    # Include only what we need
    - "dist/**"
    - "package.json"

build:
  esbuild: false # Disable built-in ESBuild support

# Serverless Plugins
plugins:
  - serverless-offline
  - serverless-prune-plugin

# Custom Configuration
custom:
  # ================================
  # STAGE-SPECIFIC CONFIGURATION
  # ================================
  # Domain names for different stages
  domainName:
    dev: ${env:DOMAIN_NAME_DEV} # Will have its own certificate
    prod: ${env:DOMAIN_NAME_PROD} # Will have its own certificate

  # Client bucket names for different stages
  clientBucketName:
    dev: ${env:S3_BUCKET_NAME_DEV}
    prod: ${env:S3_BUCKET_NAME_PROD}

  # Assets bucket names for different stages
  assetsBucketName:
    dev: ${env:S3_ASSETS_BUCKET_NAME_DEV}
    prod: ${env:S3_ASSETS_BUCKET_NAME_PROD}

  # CloudFront aliases - enable custom domains for both stages
  aliases:
    dev:
      - ${self:custom.domainName.dev} # dev.woltflow.shalev396.com
    prod:
      - ${self:custom.domainName.prod} # woltflow.shalev396.com

  # SSL/TLS Certificate configuration - use manually created certificates
  viewerCertificate:
    dev:
      AcmCertificateArn: ${env:CERTIFICATE_ARN_DEV} # Manually created dev certificate
      SslSupportMethod: sni-only
      MinimumProtocolVersion: TLSv1.2_2021
    prod:
      AcmCertificateArn: ${env:CERTIFICATE_ARN_PROD} # Manually created prod certificate
      SslSupportMethod: sni-only
      MinimumProtocolVersion: TLSv1.2_2021

  # CloudFront distribution descriptions
  distributionComment:
    dev: "WoltFlow Development"
    prod: "WoltFlow Production"

  # Serverless Offline Configuration
  serverless-offline:
    # host: 127.0.0.1 # ← Force Hapi to bind here instead of 'localhost'
    httpPort: 3000
    lambdaPort: 3002
    noPrependStageInUrl: true
    reloadHandler: true
    disableCookieValidation: true # ← Disables strictHeader cookie validation in Hapi
    enforceSecureCookies: false # ← Ensures Hapi won't require HTTPS for cookies
    printOutput: true

  # Prune Configuration - Cleanup old versions
  prune:
    automatic: true # run after each deploy
    number: 5 # keep the 5 most recent versions
    includeLayers: true

  # Environment Variables Configuration
  dotenv:
    path: ./.env

# Lambda Functions
functions:
  #auth
  authMe:
    handler: ./dist/handlers/auth/authMeHandler.handler
    events:
      - httpApi:
          path: /api/auth/me
          method: get

  logout:
    handler: ./dist/handlers/auth/logout.handler
    events:
      - httpApi:
          path: /api/auth/logout
          method: post

  oauthCallback:
    handler: ./dist/handlers/auth/oauthCallback.handler
    events:
      - httpApi:
          path: /api/oauth2/callback
          method: get

  oauthStart:
    handler: ./dist/handlers/auth/oauthStart.handler
    events:
      - httpApi:
          path: /api/oauth2/start
          method: get

  # automation no selenium
  refreshTokens:
    handler: ./dist/handlers/automation/refreshTokens.handler
    events:
      - httpApi:
          path: /api/wolt/refreshTokens
          method: get

  startAllRuns:
    handler: ./dist/handlers/automation/startAllRuns.handler
    events:
      - httpApi:
          path: /api/automation/start-all-runs
          method: get
      - schedule:
          rate: cron(0 9 ? * SUN,MON,TUE,WED,THU *)
          description: "Trigger startAllRuns on weekdays at 10:00 UTC (12:00 Israel time)"

  # gmail

  getDailyCode:
    handler: ./dist/handlers/gmail/getDailyCode.handler
    events:
      - httpApi:
          path: /api/gmail/daily-code
          method: get
  #runs
  getUserRuns:
    handler: ./dist/handlers/runs/getUserRuns.handler
    events:
      - httpApi:
          path: /api/runs
          method: get
  #setting
  getUserSettings:
    handler: ./dist/handlers/setting/getusersettings.handler
    events:
      - httpApi:
          path: /api/setting
          method: get

  setUserSettings:
    handler: ./dist/handlers/setting/setusersettings.handler
    events:
      - httpApi:
          path: /api/setting
          method: post

  #api
  generateApiKey:
    handler: ./dist/handlers/api/generateApiKey.handler
    events:
      - httpApi:
          path: /api/generate-api-key
          method: post

  #sms
  smsForward:
    handler: ./dist/handlers/sms/smsForward.handler
    events:
      - httpApi:
          path: /api/sms/forward
          method: post

  #automation with selenium
  woltBuyGift:
    image:
      name: woltflow-selenium-image
      command: ["dist/handlers/automation/woltBuyGift.handler"]
    memorySize: 1536
    ephemeralStorageSize: 1536
    timeout: 225
    events:
      - httpApi:
          path: /api/wolt/buyGift
          method: get

  woltApplyGift:
    image:
      name: woltflow-selenium-image
      command: ["dist/handlers/automation/woltApplyGift.handler"]
    memorySize: 1536
    ephemeralStorageSize: 1536
    timeout: 120
    events:
      - httpApi:
          path: /api/wolt/applyGift
          method: get

# AWS Resources Configuration
resources:
  Resources:
    # ================================
    # S3 BUCKETS CONFIGURATION
    # ================================

    # S3 Bucket for Client Files (React Vite Build)
    # This bucket will store the compiled React application files
    # Stage-specific:
    ClientFilesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.clientBucketName.${self:provider.stage}}
        # Enable public read access for static website hosting
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        # Configure for static website hosting
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html # SPA routing support
        # Enable versioning for better deployment management
        VersioningConfiguration:
          Status: Enabled
        # Lifecycle configuration to manage costs
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldVersions
              Status: Enabled
              NoncurrentVersionExpirationInDays: 30
        # CORS configuration for web access
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: [GET, HEAD]
              AllowedOrigins: ["*"]
              MaxAge: 3600

    # S3 Bucket Policy for Client Files - Allow CloudFront and public read access
    ClientFilesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: ClientFilesBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:aws:s3:::"
                      - Ref: ClientFilesBucket
                      - "/*"

    # S3 Bucket for Assets/Images
    # This bucket will store application assets like images, documents, etc.
    # Stage-specific:
    AssetsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.assetsBucketName.${self:provider.stage}}
        # Enable public read access for assets
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        # Enable versioning
        VersioningConfiguration:
          Status: Enabled
        # CORS configuration for cross-origin requests
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: [GET, HEAD, PUT, POST, DELETE]
              AllowedOrigins: ["*"]
              MaxAge: 3600

    # S3 Bucket Policy for Assets - Allow CloudFront and public read access
    AssetsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: AssetsBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:aws:s3:::"
                      - Ref: AssetsBucket
                      - "/*"

    # ================================
    # CLOUDFRONT DISTRIBUTION
    # ================================

    # CloudFront Distribution - CDN for global content delivery
    # Combines API Gateway, client files, and assets under one domain
    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          # Description for the distribution
          Comment: ${self:custom.distributionComment.${self:provider.stage}}

          # Enable the distribution
          Enabled: true

          # Domain aliases - the custom domain names (stage-specific)
          Aliases: ${self:custom.aliases.${self:provider.stage}}

          # SSL/TLS Certificate configuration
          ViewerCertificate: ${self:custom.viewerCertificate.${self:provider.stage}}

          # Default cache behavior for /* - serves React app
          DefaultCacheBehavior:
            TargetOriginId: ClientFilesOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            # Cache policy for SPA - short cache for HTML, longer for assets
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # Managed-CORS-S3Origin

          # Additional cache behaviors for specific paths
          CacheBehaviors:
            # API Gateway behavior - /api/* routes to API Gateway
            - PathPattern: "/api/*"
              TargetOriginId: ApiGatewayOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
              CachedMethods: [GET, HEAD, OPTIONS]
              Compress: true
              # No caching for API calls
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

            # Assets behavior - /images/* routes to assets bucket
            - PathPattern: "/images/*"
              TargetOriginId: AssetsOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS]
              CachedMethods: [GET, HEAD, OPTIONS]
              Compress: true
              # Long cache for assets
              CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
              OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # Managed-CORS-S3Origin

          # Origins configuration - where CloudFront fetches content from
          Origins:
            # Origin for React app files (S3 bucket)
            - Id: ClientFilesOrigin
              DomainName:
                Fn::GetAtt:
                  - ClientFilesBucket
                  - RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""

            # Origin for assets/images (S3 bucket)
            - Id: AssetsOrigin
              DomainName:
                Fn::GetAtt:
                  - AssetsBucket
                  - RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""

            # Origin for API Gateway
            - Id: ApiGatewayOrigin
              DomainName:
                Fn::Sub: "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
              CustomOriginConfig:
                HTTPPort: 443
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]

          # Error pages configuration for SPA routing
          CustomErrorResponses:
            # Redirect 403/404 to index.html for client-side routing
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 300
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 300

          # Geographic restrictions (optional)
          # Restrictions:
          #   GeoRestriction:
          #     RestrictionType: none

          # Logging configuration (optional)
          # Logging:
          #   Bucket: !Sub "${LoggingBucket}.s3.amazonaws.com"
          #   IncludeCookies: false
          #   Prefix: cloudfront-logs/

          # Price class - use all edge locations for best performance
          PriceClass: PriceClass_All

          # HTTP version
          HttpVersion: http2

          # IPv6 support
          IPV6Enabled: true

    # ================================
    # ROUTE 53 CONFIGURATION
    # ================================

    # Route 53 Record - Points custom domain to CloudFront distribution
    # Creates A records for both dev and prod stages
    Route53Record:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: ${env:HOSTED_ZONE_ID}
        Name: ${self:custom.domainName.${self:provider.stage}}
        Type: A
        # Alias configuration - points to CloudFront distribution
        AliasTarget:
          DNSName:
            Fn::GetAtt:
              - CloudFrontDistribution
              - DomainName
          HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID (global)
          EvaluateTargetHealth: false

  # ================================
  # OUTPUTS SECTION - TEMPORARILY REMOVED
  # ================================
  # Will add back once deployment works
  # Outputs:
