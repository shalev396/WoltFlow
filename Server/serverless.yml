service: woltflow-server

provider:
  name: aws
  runtime: nodejs22.x
  timeout: 30
  region: eu-central-1
  environment:
    DATABASE_URL: ${env:DATABASE_URL}
    ENV: ${env:ENV}
    GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID}
    GOOGLE_CLIENT_SECRET: ${env:GOOGLE_CLIENT_SECRET}
    OAUTH_REDIRECT_URI: ${env:OAUTH_REDIRECT_URI}
    JWT_SECRET: ${env:JWT_SECRET}
    IS_OFFLINE: ${env:IS_OFFLINE, "false"}

plugins:
  - serverless-offline
  - serverless-dotenv-plugin
  - serverless-plugin-typescript

useDotenv: true

functions:
  oauthStart:
    handler: src/handlers/auth/oauthStart.handler
    events:
      - http:
          path: /api/oauth2/start
          method: get
          cors:
            origin: "http://localhost:5173"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            allowMethods:
              - POST
              - OPTIONS
  oauthCallback:
    handler: src/handlers/auth/oauthCallback.handler
    events:
      - http:
          path: /api/oauth2/callback
          method: get
          cors:
            origin: "http://localhost:5173"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            allowMethods:
              - GET
              - OPTIONS
  authMe:
    handler: src/handlers/auth/authMeHandler.handler
    events:
      - http:
          path: /api/auth/me
          method: get
          cors:
            origin: "http://localhost:5173"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            allowMethods:
              - GET
              - OPTIONS
  getDailyCode:
    handler: src/handlers/gmail/getDailyCode.handler
    events:
      - http:
          path: /api/gmail/daily-code
          method: get
          cors:
            origin: "http://localhost:5173"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            allowMethods:
              - GET
              - OPTIONS
  getUserSettings:
    handler: src/handlers/setting/getusersettings.handler
    events:
      - http:
          path: /api/setting
          method: get
          cors:
            origin: "http://localhost:5173"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            allowMethods:
              - GET
              - OPTIONS
  setUserSettings:
    handler: src/handlers/setting/setusersettings.handler
    events:
      - http:
          path: /api/setting
          method: post
          cors:
            origin: "http://localhost:5173"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            allowMethods:
              - POST
              - OPTIONS
  woltBuyGift:
    handler: src/handlers/automation/woltBuyGift.handler
    layers:
      - { Ref: HeadlessChromiumLambdaLayer }
      - { Ref: ChromedriverLambdaLayer }
    memorySize: 1024
    timeout: 30
    events:
      - http:
          path: /api/wolt/buyGift
          method: get
          cors:
            origin: "http://localhost:5173"
            headers:
              - Content-Type
              - X-Amz-Date
              - Authorization
              - X-Api-Key
              - X-Amz-Security-Token
              - X-Amz-User-Agent
              - Cookie
            allowCredentials: true
            allowMethods:
              - GET
              - OPTIONS

custom:
  serverless-offline:
    # host: 127.0.0.1 # ← Force Hapi to bind here instead of 'localhost'
    httpPort: 3000
    lambdaPort: 3002
    noPrependStageInUrl: true
    reloadHandler: true
    disableCookieValidation: true # ← Disables strictHeader cookie validation in Hapi
    enforceSecureCookies: false # ← Ensures Hapi won’t require HTTPS for cookies
    printOutput: true

  serverless-plugin-typescript:
    tsConfigFileLocation: "./tsconfig.json"
