# ================================
# WOLTFLOW SERVERLESS CONFIGURATION
# ================================
#
# This serverless.yml configures a complete serverless application with:
# - Lambda functions for API endpoints
# - S3 buckets for client files and assets
# - CloudFront distribution for global CDN
# - Route 53 for custom domain routing
#
# DEPLOYMENT NOTES:
# 1. SSL Certificates - CREATE MANUALLY in ACM (us-east-1 region):
#    - Create certificate for dev.woltflow.shalev396.com (add ARN to CERTIFICATE_ARN_DEV)
#    - Create certificate for woltflow.shalev396.com (add ARN to CERTIFICATE_ARN_PROD)
# 2. Ensure you have a Route 53 hosted zone for shalev396.com
# 3. Deploy stages separately:
#    - DEV:  serverless deploy --stage dev  (creates dev.woltflow.shalev396.com)
#    - PROD: serverless deploy --stage prod (creates woltflow.shalev396.com)
# 4. Each stage gets its own complete infrastructure:
#    - Separate CloudFront distributions with custom domains
#    - Separate S3 buckets
#    - Separate API Gateways
#    - Separate Route 53 records
#    - Uses manually created SSL certificates
# 5. After deployment, upload your React build files to the stage-specific client bucket
# 6. Upload assets/images to the stage-specific assets bucket under the /images/ path
# 7. Both dev and prod use custom domains with manually created SSL certificates!
#
# ================================

org: shalev396

app: woltflow

service: woltflow-server

frameworkVersion: ^4.0.0

provider:
  name: aws
  # versionFunctions: false
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  timeout: 30
  memorySize: 160
  region: il-central-1
  apiGateway:
    shouldStartNameWithService: true
  logs:
    restApi: false
  httpApi:
    cors:
      allowedOrigins:
        - https://woltflow.shalev396.com
        - https://dev.woltflow.shalev396.com
        - http://localhost:5173
        - http://localhost:3000
      allowedHeaders:
        - Authorization
        - Content-Type
        - Set-Cookie
        - Cookie
        - X-API-Key
        - X-Api-Key
        - x-api-key
        - Accept
        - Origin
        - User-Agent
        - Cache-Control
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      allowCredentials: true
      exposedHeaders:
        - Set-Cookie
      maxAge: 86400
  environment:
    # Environment Configuration
    ENV: ${opt:stage, 'local'}

    # Database Configuration
    DATABASE_URL_LOCAL: ${env:DATABASE_URL_LOCAL}
    DATABASE_URL_DEV: ${env:DATABASE_URL_DEV}
    DATABASE_URL_PROD: ${env:DATABASE_URL_PROD}

    # Google OAuth Configuration
    GOOGLE_CLIENT_ID: ${env:GOOGLE_CLIENT_ID}
    GOOGLE_CLIENT_SECRET: ${env:GOOGLE_CLIENT_SECRET}
    OAUTH_REDIRECT_URI_LOCAL: ${env:OAUTH_REDIRECT_URI_LOCAL}
    OAUTH_REDIRECT_URI_DEV: ${env:OAUTH_REDIRECT_URI_DEV}
    OAUTH_REDIRECT_URI_PROD: ${env:OAUTH_REDIRECT_URI_PROD}

    # JWT Configuration
    JWT_SECRET: ${env:JWT_SECRET}
    DEVELOPMENT_DATE: ${env:DEVELOPMENT_DATE, ""}

    # SMS Configuration
    enabledSMS: ${env:ENABLED_SMS, "false"}

    # AWS Configuration - AWS_REGION is automatically provided by AWS Lambda

    # S3 Bucket Configuration
    S3_ASSETS_BUCKET_NAME_LOCAL: ${env:S3_ASSETS_BUCKET_NAME_LOCAL}
    S3_ASSETS_BUCKET_NAME_DEV: ${env:S3_ASSETS_BUCKET_NAME_DEV}
    S3_ASSETS_BUCKET_NAME_PROD: ${env:S3_ASSETS_BUCKET_NAME_PROD}

    # S3 Email Bucket Configuration
    S3_EMAIL_BUCKET_NAME_LOCAL: ${env:S3_EMAIL_BUCKET_NAME_LOCAL}
    S3_EMAIL_BUCKET_NAME_DEV: ${env:S3_EMAIL_BUCKET_NAME_DEV}
    S3_EMAIL_BUCKET_NAME_PROD: ${env:S3_EMAIL_BUCKET_NAME_PROD}

    # Email Subdomain Configuration
    EMAIL_SUBDOMAIN_LOCAL: ${env:EMAIL_SUBDOMAIN_LOCAL}
    EMAIL_SUBDOMAIN_DEV: ${env:EMAIL_SUBDOMAIN_DEV}
    EMAIL_SUBDOMAIN_PROD: ${env:EMAIL_SUBDOMAIN_PROD}

    # Lambda Function Names
    REFRESH_TOKENS_FUNCTION_NAME: ${self:service}-${self:provider.stage, 'local'}-refreshTokens
    WOLT_BUY_GIFT_FUNCTION_NAME: ${self:service}-${self:provider.stage, 'local'}-woltBuyGift
    GET_DAILY_CODE_FUNCTION_NAME: ${self:service}-${self:provider.stage, 'local'}-getDailyCode
    WOLT_APPLY_GIFT_FUNCTION_NAME: ${self:service}-${self:provider.stage, 'local'}-woltApplyGift

    # Step Functions Configuration
    USER_AUTOMATION_STATE_MACHINE_ARN:
      Fn::Sub: "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${self:service}-${self:provider.stage}-userAutomationChain"

    # CloudFront and Domain Configuration (Stage-specific)
    DOMAIN_NAME: ${self:custom.domainName.${self:provider.stage}}
    CLIENT_BUCKET_NAME: ${self:custom.clientBucketName.${self:provider.stage}}
    ASSETS_BUCKET_NAME_NEW: ${self:custom.assetsBucketName.${self:provider.stage}}
    EMAIL_BUCKET_NAME: ${self:custom.emailBucketName.${self:provider.stage}}
    HOSTED_ZONE_ID: ${env:HOSTED_ZONE_ID} # Route 53 hosted zone ID
    CERTIFICATE_ARN_DEV: ${env:CERTIFICATE_ARN_DEV} # ACM certificate ARN
    CERTIFICATE_ARN_PROD: ${env:CERTIFICATE_ARN_PROD} # ACM certificate ARN

  ecr:
    images:
      woltflow-selenium-image:
        path: ./
        file: Dockerfile
  iam:
    role:
      statements:
        # Lambda Invocation Permissions
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage, 'local'}-refreshTokens
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage, 'local'}-woltBuyGift
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage, 'local'}-getDailyCode
            - arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage, 'local'}-woltApplyGift

        # Step Functions Permissions
        - Effect: Allow
          Action:
            - states:StartExecution
            - states:StopExecution
            - states:DescribeExecution
            - states:DescribeStateMachine
            - states:ListExecutions
          Resource:
            - arn:aws:states:${self:provider.region}:*:stateMachine:${self:service}-${self:provider.stage}-userAutomationChain

        # S3 Permissions for all buckets
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:PutObjectAcl
          Resource:
            - "arn:aws:s3:::${self:custom.clientBucketName.${self:provider.stage}}/*"
            - "arn:aws:s3:::${self:custom.assetsBucketName.${self:provider.stage}}/*"
            - "arn:aws:s3:::${self:custom.emailBucketName.${self:provider.stage}}/*"

        - Effect: Allow
          Action:
            - s3:ListBucket
          Resource:
            - "arn:aws:s3:::${self:custom.clientBucketName.${self:provider.stage}}"
            - "arn:aws:s3:::${self:custom.assetsBucketName.${self:provider.stage}}"
            - "arn:aws:s3:::${self:custom.emailBucketName.${self:provider.stage}}"

        # ECR Permissions
        - Effect: Allow
          Action: ecr:GetAuthorizationToken
          Resource: "*"
        - Effect: Allow
          Action:
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchGetImage
            - ecr:InitiateLayerUpload
            - ecr:UploadLayerPart
            - ecr:CompleteLayerUpload
            - ecr:PutImage
          Resource: "*"

        # CloudFront Permissions
        - Effect: Allow
          Action:
            - cloudfront:CreateInvalidation
            - cloudfront:GetInvalidation
            - cloudfront:ListInvalidations
          Resource: "*"

        # SNS Permissions for SMS
        - Effect: Allow
          Action:
            - sns:Publish
            - sns:CreateTopic
            - sns:Subscribe
            - sns:GetSMSAttributes
            - sns:SetSMSAttributes
            - sns:CheckIfPhoneNumberIsOptedOut
            - sns:OptInPhoneNumber
            # Long Code and Origination Number Management
            - sns:GetOriginationNumbers
            - sns:RequestOriginationNumber
            - sns:DeleteOriginationNumber
            - sns:ListOriginationNumbers
            # SMS Sandbox and Configuration
            - sns:GetSMSSandboxAccountStatus
            - sns:PromotePhoneNumber
            - sns:VerifySMSSandboxPhoneNumber
            - sns:ListSMSSandboxPhoneNumbers
            - sns:DeleteSMSSandboxPhoneNumber
            - sns:CreateSMSSandboxPhoneNumber
          Resource: "*"

        # AWS End User Messaging (for Sender ID management)
        - Effect: Allow
          Action:
            - sms-voice:DescribePhoneNumbers
            - sms-voice:PutKeyword
            - sms-voice:DeleteKeyword
            - sms-voice:DescribeKeywords
            - sms-voice:PutOptedOutNumber
            - sms-voice:DeleteOptedOutNumber
            - sms-voice:DescribeOptedOutNumbers
            - sms-voice:SendTextMessage
            - sms-voice:SendVoiceMessage
            - sms-voice:DescribeConfigurationSets
            - sms-voice:DescribeSenderIds
            # Pinpoint SMS (alternative SMS service)
            - mobiletargeting:SendMessages
            - mobiletargeting:SendUsersMessages
            - mobiletargeting:GetSmsChannel
            - mobiletargeting:UpdateSmsChannel
          Resource: "*"

        # SES Permissions for Email
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
            - ses:SendTemplatedEmail
            - ses:SendBulkTemplatedEmail
            - ses:GetSendStatistics
            - ses:GetSendQuota
            - ses:GetIdentityVerificationAttributes
            - ses:GetIdentityDkimAttributes
            - ses:ListIdentities
            - ses:ListVerifiedEmailAddresses
            - ses:VerifyEmailIdentity
            - ses:VerifyDomainIdentity
            # Additional SES permissions for email receipt
            - ses:CreateReceiptRule
            - ses:CreateReceiptRuleSet
            - ses:DeleteReceiptRule
            - ses:DeleteReceiptRuleSet
            - ses:DescribeReceiptRule
            - ses:DescribeReceiptRuleSet
            - ses:ListReceiptRuleSets
            - ses:SetActiveReceiptRuleSet
            - ses:UpdateReceiptRule
            - ses:PutIdentityPolicy
            - ses:GetIdentityPolicies
            - ses:DeleteIdentityPolicy
          Resource: "*"

# Package Configuration
package:
  individually: true
  excludeDevDependencies: true
  patterns:
    # Exclude source and development files
    - "!src/**"
    - "!dist/**"
    - "!.serverless/**"
    - "!tsconfig.json"
    - "!webpack.config.cjs"
    - "!*.md"
    - "!screenshots/**"
    - "!undefined/**"
    - "!*.zip"
    - "!.env*"
    - "!.dockerignore"
    - "!Dockerfile"
    - "!patches/**"
    - "!woltBuyGift.json"

    # Exclude all node_modules - webpack bundles everything
    - "!node_modules/**"

    # Exclude build directory - handled per function
    - "!build/**"

    # Global files that all functions need
    - "package.json"

build:
  esbuild: false # Disable built-in ESBuild support - using webpack instead

# Serverless Plugins
plugins:
  - serverless-offline
  - serverless-prune-plugin
  - serverless-step-functions

# Custom Configuration
custom:
  # ================================
  # STAGE-SPECIFIC CONFIGURATION
  # ================================
  # Domain names for different stages
  domainName:
    local: ${env:DOMAIN_NAME_LOCAL}
    dev: ${env:DOMAIN_NAME_DEV} # Will have its own certificate
    prod: ${env:DOMAIN_NAME_PROD} # Will have its own certificate

  # Client bucket names for different stages
  clientBucketName:
    local: ${env:S3_BUCKET_NAME_LOCAL}
    dev: ${env:S3_BUCKET_NAME_DEV}
    prod: ${env:S3_BUCKET_NAME_PROD}

  # Assets bucket names for different stages
  assetsBucketName:
    local: ${env:S3_ASSETS_BUCKET_NAME_LOCAL}
    dev: ${env:S3_ASSETS_BUCKET_NAME_DEV}
    prod: ${env:S3_ASSETS_BUCKET_NAME_PROD}

  # Email bucket names for different stages
  emailBucketName:
    local: ${env:S3_EMAIL_BUCKET_NAME_LOCAL}
    dev: ${env:S3_EMAIL_BUCKET_NAME_DEV}
    prod: ${env:S3_EMAIL_BUCKET_NAME_PROD}

  # Email subdomain names for different stages
  emailSubdomain:
    local: ${env:EMAIL_SUBDOMAIN_LOCAL}
    dev: ${env:EMAIL_SUBDOMAIN_DEV}
    prod: ${env:EMAIL_SUBDOMAIN_PROD}

  # CloudFront aliases - enable custom domains for both stages
  aliases:
    local:
      - ${self:custom.domainName.local} # local.woltflow.shalev396.com
    dev:
      - ${self:custom.domainName.dev} # dev.woltflow.shalev396.com
    prod:
      - ${self:custom.domainName.prod} # woltflow.shalev396.com

  # SSL/TLS Certificate configuration - use manually created certificates
  viewerCertificate:
    local:
      AcmCertificateArn: ${env:CERTIFICATE_ARN_LOCAL} # Manually created local certificate
      SslSupportMethod: sni-only
      MinimumProtocolVersion: TLSv1.2_2021
    dev:
      AcmCertificateArn: ${env:CERTIFICATE_ARN_DEV} # Manually created dev certificate
      SslSupportMethod: sni-only
      MinimumProtocolVersion: TLSv1.2_2021
    prod:
      AcmCertificateArn: ${env:CERTIFICATE_ARN_PROD} # Manually created prod certificate
      SslSupportMethod: sni-only
      MinimumProtocolVersion: TLSv1.2_2021

  # CloudFront distribution descriptions
  distributionComment:
    local: "WoltFlow Local"
    dev: "WoltFlow Development"
    prod: "WoltFlow Production"

  # Serverless Offline Configuration
  serverless-offline:
    # host: 127.0.0.1 # ← Force Hapi to bind here instead of 'localhost'
    httpPort: 3000
    lambdaPort: 3002
    noPrependStageInUrl: true
    reloadHandler: true
    disableCookieValidation: true # ← Disables strictHeader cookie validation in Hapi
    enforceSecureCookies: false # ← Ensures Hapi won't require HTTPS for cookies
    printOutput: true

  # Prune Configuration - Cleanup old versions
  prune:
    automatic: true # run after each deploy
    number: 5 # keep the 5 most recent versions
    includeLayers: true

  # Environment Variables Configuration
  dotenv:
    path: ./.env

# Step Functions Configuration
stepFunctions:
  stateMachines:
    userAutomationChain:
      name: ${self:service}-${self:provider.stage, 'local'}-userAutomationChain
      definition:
        Comment: "Run automation chain per user in parallel"
        StartAt: ProcessAllUsers
        States:
          ProcessAllUsers:
            Type: Map
            ItemsPath: $.users
            MaxConcurrency: 10
            Iterator:
              StartAt: RefreshTokens
              States:
                RefreshTokens:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${self:service}-${self:provider.stage, 'local'}-refreshTokens
                    Payload:
                      runId.$: $.runId
                  OutputPath: $.Payload
                  Next: WoltBuyGift
                  Catch:
                    - ErrorEquals:
                        - States.ALL
                      Next: MarkRunFailed
                      ResultPath: $.error

                WoltBuyGift:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${self:service}-${self:provider.stage, 'local'}-woltBuyGift
                    Payload:
                      runId.$: $.runId
                  OutputPath: $.Payload
                  Next: CheckBuyOnlyMode
                  Catch:
                    - ErrorEquals:
                        - States.ALL
                      Next: MarkRunFailed
                      ResultPath: $.error

                CheckBuyOnlyMode:
                  Type: Choice
                  Choices:
                    - Variable: $.completed
                      BooleanEquals: true
                      Next: MarkRunSuccess
                  Default: GetDailyCode

                GetDailyCode:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${self:service}-${self:provider.stage, 'local'}-getDailyCode
                    Payload:
                      runId.$: $.runId
                  OutputPath: $.Payload
                  Next: WoltApplyGift
                  Catch:
                    - ErrorEquals:
                        - States.ALL
                      Next: MarkRunFailed
                      ResultPath: $.error

                WoltApplyGift:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${self:service}-${self:provider.stage, 'local'}-woltApplyGift
                    Payload:
                      runId.$: $.runId
                  OutputPath: $.Payload
                  Next: MarkRunSuccess
                  Catch:
                    - ErrorEquals:
                        - States.ALL
                      Next: MarkRunFailed
                      ResultPath: $.error

                MarkRunSuccess:
                  Type: Pass
                  Result: "Run completed successfully"
                  End: true

                MarkRunFailed:
                  Type: Pass
                  Result: "Run failed"
                  End: true
            End: true

# Lambda Functions
functions:
  # ================================
  # AUTH FUNCTIONS
  # ================================
  authMe:
    handler: ./build/auth/authMeHandler.handler
    package:
      patterns:
        - "!build/**"
        - "build/auth/authMeHandler.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/auth/me
          method: get

  logout:
    handler: ./build/auth/logout.handler
    package:
      patterns:
        - "!build/**"
        - "build/auth/logout.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/auth/logout
          method: post

  oauthCallback:
    handler: ./build/auth/oauthCallback.handler
    package:
      patterns:
        - "!build/**"
        - "build/auth/oauthCallback.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/oauth2/callback
          method: get

  oauthStart:
    handler: ./build/auth/oauthStart.handler
    package:
      patterns:
        - "!build/**"
        - "build/auth/oauthStart.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/oauth2/start
          method: get

  # ================================
  # AUTOMATION FUNCTIONS
  # ================================
  # CRITICAL: Do not modify selenium automation functions - they are working after hours of fixing!

  startUserAutomationChain:
    handler: ./build/automation/A_startUserAutomationChain.handler
    package:
      patterns:
        - "!build/**"
        - "build/automation/A_startUserAutomationChain.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/automation/start-chain
          method: get
      - schedule:
          rate: cron(0 9 ? * SUN,MON,TUE,WED,THU *) # cron(30 17 ? * SUN,MON,TUE,WED,THU *)
          description: "Trigger user automation chain on weekdays at 10:00 UTC (12:00 Israel time)"
          enabled: true

  # Non-selenium automation function
  refreshTokens:
    handler: ./build/automation/B_refreshTokens.handler
    package:
      patterns:
        - "!build/**"
        - "build/automation/B_refreshTokens.mjs"
        - "package.json"
    # No HTTP events - only called by Step Functions

  # SELENIUM AUTOMATION FUNCTIONS - DO NOT MODIFY CONFIGURATION!
  woltBuyGift:
    image:
      name: woltflow-selenium-image
      command: ["build/automation/C_woltBuyGift.handler"]
    memorySize: 1536
    ephemeralStorageSize: 1536
    timeout: 250
    # No HTTP events - only called by Step Functions

  # Non-selenium function for email processing
  getDailyCode:
    handler: ./build/automation/D_getDailyCode.handler
    package:
      patterns:
        - "!build/**"
        - "build/automation/D_getDailyCode.mjs"
        - "package.json"
    # No HTTP events - only called by Step Functions

  # SELENIUM AUTOMATION FUNCTIONS - DO NOT MODIFY CONFIGURATION!
  woltApplyGift:
    image:
      name: woltflow-selenium-image
      command: ["build/automation/E_woltApplyGift.handler"]
    memorySize: 1536
    ephemeralStorageSize: 1536
    timeout: 150
    # No HTTP events - only called by Step Functions

  # ================================
  # FORWARD FUNCTIONS
  # ================================
  generateApiKey:
    handler: ./build/forward/api/Create.handler
    package:
      patterns:
        - "!build/**"
        - "build/forward/api/Create.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/forward/api/generate
          method: post

  smsForward:
    handler: ./build/forward/sms/create.handler
    package:
      patterns:
        - "!build/**"
        - "build/forward/sms/create.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/forward/sms
          method: post

  # ================================
  # HEALTH FUNCTIONS
  # ================================
  healthCheck:
    handler: ./build/health/get.handler
    package:
      patterns:
        - "!build/**"
        - "build/health/get.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/health
          method: get

  # ================================
  # RUNS FUNCTIONS
  # ================================
  getUserRuns:
    handler: ./build/runs/GetAll.handler
    package:
      patterns:
        - "!build/**"
        - "build/runs/GetAll.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/runs
          method: get

  # ================================
  # SETTINGS FUNCTIONS
  # ================================

  # Cibus Settings
  getCibusSettings:
    handler: ./build/settings/cibus/Get.handler
    package:
      patterns:
        - "!build/**"
        - "build/settings/cibus/Get.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/settings/cibus
          method: get

  updateCibusSettings:
    handler: ./build/settings/cibus/Update.handler
    package:
      patterns:
        - "!build/**"
        - "build/settings/cibus/Update.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/settings/cibus
          method: put

  # Notification Settings
  getNotificationSettings:
    handler: ./build/settings/notification/Get.handler
    package:
      patterns:
        - "!build/**"
        - "build/settings/notification/Get.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/settings/notification
          method: get

  updateNotificationSettings:
    handler: ./build/settings/notification/Update.handler
    package:
      patterns:
        - "!build/**"
        - "build/settings/notification/Update.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/settings/notification
          method: put

  # 2FA Functions
  start2FA:
    handler: ./build/settings/notification/TwoFactorAuthentication/Create.handler
    package:
      patterns:
        - "!build/**"
        - "build/settings/notification/TwoFactorAuthentication/Create.mjs"
        - "package.json"
        - "templates/**"
    events:
      - httpApi:
          path: /api/settings/notification/2fa/start
          method: post

  verify2FA:
    handler: ./build/settings/notification/TwoFactorAuthentication/verify.handler
    package:
      patterns:
        - "!build/**"
        - "build/settings/notification/TwoFactorAuthentication/verify.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/settings/notification/2fa/verify
          method: post

  # Run Settings
  getRunSettings:
    handler: ./build/settings/run/Get.handler
    package:
      patterns:
        - "!build/**"
        - "build/settings/run/Get.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/settings/run
          method: get

  updateRunSettings:
    handler: ./build/settings/run/Update.handler
    package:
      patterns:
        - "!build/**"
        - "build/settings/run/Update.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/settings/run
          method: put

  # Wolt Settings
  getWoltSettings:
    handler: ./build/settings/wolt/Get.handler
    package:
      patterns:
        - "!build/**"
        - "build/settings/wolt/Get.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/settings/wolt
          method: get

  updateWoltSettings:
    handler: ./build/settings/wolt/Update.handler
    package:
      patterns:
        - "!build/**"
        - "build/settings/wolt/Update.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/settings/wolt
          method: put

  # ================================
  # TEST FUNCTIONS
  # ================================
  testEmail:
    handler: ./build/test/testEmail.handler
    package:
      patterns:
        - "!build/**"
        - "build/test/testEmail.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/test/email
          method: post
    # Test Email function - send POST request with { "email": "test@example.com" }

  testSms:
    handler: ./build/test/testSms.handler
    package:
      patterns:
        - "!build/**"
        - "build/test/testSms.mjs"
        - "package.json"
    events:
      - httpApi:
          path: /api/test/sms
          method: post
    # Test SMS function - send POST request with { "phoneNumber": "+972XXXXXXXXX" }
# AWS Resources Configuration
resources:
  Resources:
    # ================================
    # S3 BUCKETS CONFIGURATION
    # ================================

    # S3 Bucket for Client Files (React Vite Build)
    # This bucket will store the compiled React application files
    # Stage-specific:
    ClientFilesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.clientBucketName.${self:provider.stage}}
        # Enable public read access for static website hosting
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        # Configure for static website hosting
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html # SPA routing support
        # Enable versioning for better deployment management
        VersioningConfiguration:
          Status: Enabled
        # Lifecycle configuration to manage costs
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldVersions
              Status: Enabled
              NoncurrentVersionExpirationInDays: 30
        # CORS configuration for web access
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: [GET, HEAD]
              AllowedOrigins: ["*"]
              MaxAge: 3600

    # S3 Bucket Policy for Client Files - Allow CloudFront and public read access
    ClientFilesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: ClientFilesBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:aws:s3:::"
                      - Ref: ClientFilesBucket
                      - "/*"

    # S3 Bucket for Assets/Images
    # This bucket will store application assets like images, documents, etc.
    # Stage-specific:
    AssetsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.assetsBucketName.${self:provider.stage}}
        # Enable public read access for assets
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        # Enable versioning
        VersioningConfiguration:
          Status: Enabled
        # CORS configuration for cross-origin requests
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: [GET, HEAD, PUT, POST, DELETE]
              AllowedOrigins: ["*"]
              MaxAge: 3600

    # S3 Bucket Policy for Assets - Allow CloudFront and public read access
    AssetsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: AssetsBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:aws:s3:::"
                      - Ref: AssetsBucket
                      - "/*"

    # S3 Bucket for Emails
    # This bucket will store email content and attachments from SES
    # Stage-specific:
    EmailBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.emailBucketName.${self:provider.stage}}
        # Private bucket - no public access for emails
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        # Enable versioning for email backup
        VersioningConfiguration:
          Status: Enabled
        # Lifecycle configuration to manage email storage costs
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldEmails
              Status: Enabled
              ExpirationInDays: 365 # Keep emails for 1 year
            - Id: ArchiveOldEmails
              Status: Enabled
              Transitions:
                - TransitionInDays: 30
                  StorageClass: STANDARD_IA
                - TransitionInDays: 90
                  StorageClass: GLACIER
        # CORS configuration for Lambda access
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: [GET, HEAD, PUT, POST, DELETE]
              AllowedOrigins: ["*"]
              MaxAge: 3600
        # Server-side encryption for email security
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    # S3 Bucket Policy for Emails - Private access only
    EmailBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: EmailBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: DenyPublicAccess
              Effect: Deny
              Principal: "*"
              Action: "s3:*"
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:aws:s3:::"
                      - Ref: EmailBucket
                - Fn::Join:
                    - ""
                    - - "arn:aws:s3:::"
                      - Ref: EmailBucket
                      - "/*"
              Condition:
                Bool:
                  "aws:SecureTransport": "false"
            - Sid: AllowLambdaAccess
              Effect: Allow
              Principal:
                AWS:
                  Fn::Sub: "arn:aws:iam::${AWS::AccountId}:root"
              Action:
                - "s3:GetObject"
                - "s3:PutObject"
                - "s3:DeleteObject"
                - "s3:ListBucket"
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:aws:s3:::"
                      - Ref: EmailBucket
                - Fn::Join:
                    - ""
                    - - "arn:aws:s3:::"
                      - Ref: EmailBucket
                      - "/*"

    # ================================
    # SES EMAIL INFRASTRUCTURE
    # ================================

    # SES Domain Identity for Email Subdomain
    SESEmailIdentity:
      Type: AWS::SES::EmailIdentity
      Properties:
        EmailIdentity: ${self:custom.emailSubdomain.${self:provider.stage}}
        DkimSigningEnabled: true
        DkimSigningAttributes:
          NextSigningKeyLength: RSA_2048_BIT
        FeedbackAttributes:
          EmailForwardingEnabled: false
        ConfigurationSetAttributes:
          ConfigurationSetName: !Ref SESConfigurationSet

    # SES Configuration Set
    SESConfigurationSet:
      Type: AWS::SES::ConfigurationSet
      Properties:
        Name: ${self:service}-${self:provider.stage}-email-config
        DeliveryOptions:
          TlsPolicy: Require
        TrackingOptions:
          CustomRedirectDomain: ${self:custom.emailSubdomain.${self:provider.stage}}

    # SES Receipt Rule Set
    SESReceiptRuleSet:
      Type: AWS::SES::ReceiptRuleSet
      Properties:
        RuleSetName: ${self:service}-${self:provider.stage}-email-rules

    # SES Receipt Rule for User Emails
    SESReceiptRule:
      Type: AWS::SES::ReceiptRule
      DependsOn:
        - SESReceiptRuleSet
        - EmailBucket
      Properties:
        RuleSetName: !Ref SESReceiptRuleSet
        Rule:
          Name: capture-user-emails
          Recipients:
            - ${self:custom.emailSubdomain.${self:provider.stage}}
          Enabled: true
          ScanEnabled: true
          Actions:
            - S3Action:
                BucketName: !Ref EmailBucket
                ObjectKeyPrefix: raw/
            # - LambdaAction:
            #     FunctionArn: !GetAtt IngestEmailLambdaFunction.Arn
            #     InvocationType: Event

    # SES Lambda Permission
    # SESLambdaInvokePermission:
    #   Type: AWS::Lambda::Permission
    #   Properties:
    #     FunctionName: !Ref IngestEmailLambdaFunction
    #     Action: lambda:InvokeFunction
    #     Principal: ses.amazonaws.com
    #     SourceAccount: !Ref AWS::AccountId

    # S3 Bucket Policy for SES Email Storage
    SESEmailBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref EmailBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: AllowSESPuts
              Effect: Allow
              Principal:
                Service: ses.amazonaws.com
              Action:
                - s3:PutObject
                - s3:PutObjectAcl
              Resource: !Sub "${EmailBucket}/*"
              Condition:
                StringEquals:
                  "aws:Referer": !Ref AWS::AccountId

    # ================================
    # CLOUDFRONT DISTRIBUTION
    # ================================

    # CloudFront Distribution - CDN for global content delivery
    # Combines API Gateway, client files, and assets under one domain
    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          # Description for the distribution
          Comment: ${self:custom.distributionComment.${self:provider.stage}}

          # Enable the distribution
          Enabled: true

          # Domain aliases - the custom domain names (stage-specific)
          Aliases: ${self:custom.aliases.${self:provider.stage}}

          # SSL/TLS Certificate configuration
          ViewerCertificate: ${self:custom.viewerCertificate.${self:provider.stage}}

          # Default cache behavior for /* - serves React app
          DefaultCacheBehavior:
            TargetOriginId: ClientFilesOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            # Cache policy for SPA - short cache for HTML, longer for assets
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # Managed-CORS-S3Origin

          # Additional cache behaviors for specific paths
          CacheBehaviors:
            # API Gateway behavior - /api/* routes to API Gateway
            - PathPattern: "/api/*"
              TargetOriginId: ApiGatewayOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
              CachedMethods: [GET, HEAD, OPTIONS]
              Compress: true
              # No caching for API calls
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

            # Assets behavior - /images/* routes to assets bucket
            - PathPattern: "/images/*"
              TargetOriginId: AssetsOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS]
              CachedMethods: [GET, HEAD, OPTIONS]
              Compress: true
              # Long cache for assets
              CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
              OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # Managed-CORS-S3Origin

          # Origins configuration - where CloudFront fetches content from
          Origins:
            # Origin for React app files (S3 bucket)
            - Id: ClientFilesOrigin
              DomainName:
                Fn::GetAtt:
                  - ClientFilesBucket
                  - RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""

            # Origin for assets/images (S3 bucket)
            - Id: AssetsOrigin
              DomainName:
                Fn::GetAtt:
                  - AssetsBucket
                  - RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""

            # Origin for API Gateway
            - Id: ApiGatewayOrigin
              DomainName:
                Fn::Sub: "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
              CustomOriginConfig:
                HTTPPort: 443
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]

          # Error pages configuration for SPA routing
          CustomErrorResponses:
            # Redirect 403/404 to index.html for client-side routing
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 300
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 300

          # Geographic restrictions (optional)
          # Restrictions:
          #   GeoRestriction:
          #     RestrictionType: none

          # Logging configuration (optional)
          # Logging:
          #   Bucket: !Sub "${LoggingBucket}.s3.amazonaws.com"
          #   IncludeCookies: false
          #   Prefix: cloudfront-logs/

          # Price class - use all edge locations for best performance
          PriceClass: PriceClass_All

          # HTTP version
          HttpVersion: http2

          # IPv6 support
          IPV6Enabled: true

    # ================================
    # ROUTE 53 CONFIGURATION
    # ================================

    # Route 53 Record - Points custom domain to CloudFront distribution
    # Creates A records for both dev and prod stages
    Route53Record:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: ${env:HOSTED_ZONE_ID}
        Name: ${self:custom.domainName.${self:provider.stage}}
        Type: A
        # Alias configuration - points to CloudFront distribution
        AliasTarget:
          DNSName:
            Fn::GetAtt:
              - CloudFrontDistribution
              - DomainName
          HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID (global)
          EvaluateTargetHealth: false
