# ================================
# WOLTFLOW SERVERLESS CONFIGURATION
# ================================
#
# This serverless.yml configures a complete serverless application with:
# - Lambda functions for API endpoints
# - S3 buckets for client files and assets
# - CloudFront distribution for global CDN
# - Route 53 for custom domain routing
#
# DEPLOYMENT NOTES:
# 1. SSL Certificates - CREATE MANUALLY in ACM (us-east-1 region):
#    - Create certificate for development domain (add ARN to CERTIFICATE_ARN_DEV)
#    - Create certificate for production domain (add ARN to CERTIFICATE_ARN_PROD)
# 2. Ensure you have a Route 53 hosted zone for the domain
# 3. Deploy stages separately:
#    - DEV:  serverless deploy --stage dev  (creates development environment)
#    - PROD: serverless deploy --stage prod (creates production environment)
# 4. Each stage gets its own complete infrastructure:
#    - Separate CloudFront distributions with custom domains
#    - Separate S3 buckets
#    - Separate API Gateways
#    - Separate Route 53 records
#    - Uses manually created SSL certificates
# 5. After deployment, upload your React build files to the stage-specific client bucket
# 6. Upload assets/images to the stage-specific assets bucket under the /images/ path
# 7. Both dev and prod use custom domains with manually created SSL certificates!
#
# ================================

org: shalev396

app: woltflow

service: woltflow-server

frameworkVersion: ^4.0.0

provider:
  name: aws
  # versionFunctions: false
  stage: ${opt:stage, 'dev'}
  runtime: nodejs22.x
  timeout: 30
  memorySize: 160
  region: ${env:AWS_REGION}
  # Configure log retention for all Lambda functions
  logRetentionInDays: 30

  # VPC Configuration - All Lambdas run in private subnet with NAT Gateway
  vpc:
    securityGroupIds:
      - ${env:LAMBDA_SECURITY_GROUP_ID}
    subnetIds:
      - ${env:LAMBDA_SUBNET_ID}

  apiGateway:
    shouldStartNameWithService: true
  logs:
    restApi: false
  httpApi:
    cors:
      allowedOrigins:
        - ${self:custom.domainWithProtocol.${env:IS_LOCAL}}
      allowedHeaders:
        - Content-Type
        - Cookie
        - X-API-Key
        - Accept
        - User-Agent
        - Cache-Control
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
        - HEAD
      allowCredentials: true
      maxAge: 86400
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl:
          Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}
        audience:
          - Ref: CognitoUserPoolClient
  environment:
    # ENV
    ENV: ${opt:stage, 'dev'}
    # AWS
    AWS_ACCOUNT_ID: ${env:AWS_ACCOUNT_ID}
    DOMAIN_NAME: ${self:custom.domainName.${env:IS_LOCAL}}
    HOSTED_ZONE_ID: ${env:HOSTED_ZONE_ID}
    CERTIFICATE_ARN: ${env:CERTIFICATE_ARN}
    # STEP FUNCTIONS
    USER_AUTOMATION_STATE_MACHINE_ARN:
      Fn::Sub: "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${self:service}-${self:provider.stage}-userAutomationChain"
    # S3
    S3_ASSETS_BUCKET_NAME: ${env:S3_ASSETS_BUCKET_NAME}
    S3_CLIENT_BUCKET_NAME: ${env:S3_CLIENT_BUCKET_NAME}
    # SERVERLESS
    SERVERLESS_ACCESS_KEY: ${env:SERVERLESS_ACCESS_KEY}
    # DATABASE
    DATABASE_URL: ${self:custom.databaseUrl.${env:IS_LOCAL}}
    # VPC
    LAMBDA_SECURITY_GROUP_ID: ${env:LAMBDA_SECURITY_GROUP_ID}
    LAMBDA_SUBNET_ID: ${env:LAMBDA_SUBNET_ID}
    # APP
    ENABLED_SMS: ${env:ENABLED_SMS}
    ENCRYPTION_KEY: ${env:ENCRYPTION_KEY}
    # COGNITO - Set these manually in .env after first deployment
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID}
    COGNITO_ISSUER: ${env:COGNITO_ISSUER}

  ecr:
    # Keep only the most recent image versions via a native ECR lifecycle policy.
    # Currently-tagged (live) images are never expired.
    maxImages: 5
    images:
      woltflow-selenium-image:
        path: ./
        file: Dockerfile
  iam:
    role:
      statements:
        # Cognito Permissions - Account linking in PreSignUp trigger
        - Effect: Allow
          Action:
            - cognito-idp:ListUsers
            - cognito-idp:AdminLinkProviderForUser
            - cognito-idp:AdminGetUser
            - cognito-idp:AdminCreateUser
            - cognito-idp:AdminSetUserPassword
            - cognito-idp:AdminDeleteUser
          Resource:
            - arn:aws:cognito-idp:${self:provider.region}:*:userpool/*

        # VPC/ENI Permissions - Required for Lambda to run in VPC
        - Effect: Allow
          Action:
            - ec2:CreateNetworkInterface
            - ec2:DescribeNetworkInterfaces
            - ec2:DeleteNetworkInterface
            - ec2:AssignPrivateIpAddresses
            - ec2:UnassignPrivateIpAddresses
          Resource: "*"

        # Step Functions Permissions (startUserAutomationChain)
        - Effect: Allow
          Action:
            - states:StartExecution
          Resource:
            - arn:aws:states:${self:provider.region}:*:stateMachine:${self:service}-${self:provider.stage}-userAutomationChain

        # S3 Permissions - Assets bucket (screenshots, exports)
        - Effect: Allow
          Action:
            - s3:PutObject # Upload screenshots, export ZIPs
            - s3:GetObject # Download files for processing
            - s3:DeleteObject # Delete expired screenshots, user data
          Resource:
            - "arn:aws:s3:::${env:S3_ASSETS_BUCKET_NAME}/*"

        # ECR Permissions (Docker-based Lambda functions: woltBuyGift)
        - Effect: Allow
          Action: ecr:GetAuthorizationToken
          Resource: "*"
        - Effect: Allow
          Action:
            - ecr:BatchCheckLayerAvailability
            - ecr:GetDownloadUrlForLayer
            - ecr:BatchGetImage
          Resource: "*"

        # Pinpoint SMS Voice V2 Permissions (smsUtil.ts uses PinpointSMSVoiceV2Client)
        - Effect: Allow
          Action:
            - sms-voice:SendTextMessage
          Resource: "*"

        # SES Permissions for Email (emailUtil.ts uses SES SendEmail)
        - Effect: Allow
          Action:
            - ses:SendEmail
          Resource: "*"

# Package Configuration
package:
  individually: true
  excludeDevDependencies: true
  patterns:
    # Exclude source and development files
    - "!src/**"
    - "!dist/**"
    - "!.serverless/**"
    - "!tsconfig.json"
    - "!webpack.config.cjs"
    - "!*.md"
    - "!screenshots/**"
    - "!undefined/**"
    - "!*.zip"
    - "!.env*"
    - "!.dockerignore"
    - "!Dockerfile"
    - "!patches/**"
    - "!woltBuyGift.json"

    # Exclude all node_modules - webpack bundles everything
    - "!node_modules/**"

    # Exclude build directory - handled per function
    - "!build/**"

    # Global files that all functions need
    - "package.json"

build:
  esbuild: false # Disable built-in ESBuild support - using webpack instead

# Serverless Plugins
plugins:
  - serverless-offline
  - serverless-step-functions

# Custom Configuration
custom:
  # Auto-select database URL based on IS_LOCAL environment variable
  # Set IS_LOCAL=true for local dev, IS_LOCAL=false for cloud deployment
  databaseUrl:
    true: ${env:DATABASE_URL_LOCAL}
    false: ${env:DATABASE_URL_CLOUD}

  # Auto-select domain name based on IS_LOCAL environment variable
  domainName:
    true: "localhost:5173"
    false: ${env:DOMAIN_NAME_CLOUD}

  # Domain with protocol for CORS (conditional)
  domainWithProtocol:
    true: http://localhost:5173
    false: https://${env:DOMAIN_NAME_CLOUD}

  # SSL/TLS Certificate configuration - use manually created certificates
  viewerCertificate:
    AcmCertificateArn: ${env:CERTIFICATE_ARN} # Manually created local certificate
    SslSupportMethod: sni-only
    MinimumProtocolVersion: TLSv1.2_2021

  # CloudFront distribution descriptions
  distributionComment:
    local: "WoltFlow Local"
    dev: "WoltFlow Development"
    prod: "WoltFlow Production"

  # Serverless Offline Configuration
  serverless-offline:
    # host: 127.0.0.1 # ← Force Hapi to bind here instead of 'localhost'
    httpPort: 3000
    lambdaPort: 3002
    noPrependStageInUrl: true
    reloadHandler: true
    disableCookieValidation: true # ← Disables strictHeader cookie validation in Hapi
    enforceSecureCookies: false # ← Ensures Hapi won't require HTTPS for cookies
    printOutput: true
    noAuth: true

  # Prune Configuration - Cleanup old versions
  prune:
    automatic: true # run after each deploy
    number: 5 # keep the 5 most recent versions
    includeLayers: true

  # Environment Variables Configuration
  envFile: .env.${sls:stage}

# Step Functions Configuration
stepFunctions:
  stateMachines:
    userAutomationChain:
      name: ${self:service}-${self:provider.stage, 'local'}-userAutomationChain
      definition:
        Comment: "Run automation chain per user in parallel"
        StartAt: ProcessAllUsers
        States:
          ProcessAllUsers:
            Type: Map
            ItemsPath: $.users
            MaxConcurrency: 10
            Iterator:
              StartAt: RefreshTokens
              States:
                RefreshTokens:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${self:service}-${self:provider.stage, 'local'}-refreshTokens
                    Payload:
                      runId.$: $.runId
                  OutputPath: $.Payload
                  Next: WoltBuyGift
                  Catch:
                    - ErrorEquals:
                        - States.ALL
                      Next: MarkRunFailed
                      ResultPath: $.error

                WoltBuyGift:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${self:service}-${self:provider.stage, 'local'}-woltBuyGift
                    Payload:
                      runId.$: $.runId
                  OutputPath: $.Payload
                  Next: MarkRunSuccess
                  Catch:
                    - ErrorEquals:
                        - States.ALL
                      Next: MarkRunFailed
                      ResultPath: $.error

                MarkRunSuccess:
                  Type: Pass
                  Result: "Run completed successfully"
                  End: true

                MarkRunFailed:
                  Type: Pass
                  Result: "Run failed"
                  End: true
            End: true

# Lambda Functions
functions:
  # ================================
  # DOMAIN-BASED EXPRESS FUNCTIONS
  # ================================

  # PUBLIC: Authentication & Health
  authApi:
    handler: build/api/auth-handler.handler
    timeout: 30
    memorySize: 256
    package:
      patterns:
        - "!build/**"
        - "build/api/auth-handler.mjs"
        - "package.json"
        - "templates/**"
    events:
      - httpApi:
          path: /api/auth/{proxy+}
          method: ANY

  # PRIVATE: All authenticated user operations
  userApi:
    handler: build/api/user-handler.handler
    timeout: 120 # Higher for export/delete operations
    memorySize: 1024 # Higher for ZIP creation in export
    package:
      patterns:
        - "!build/**"
        - "build/api/user-handler.mjs"
        - "package.json"
        - "templates/**"
    events:
      - httpApi:
          path: /api/user/{proxy+}
          method: ANY
          authorizer:
            name: cognitoAuthorizer

  # ================================
  # AUTOMATION CHAIN (UNCHANGED)
  # ================================

  # Automation chain starter (SCHEDULED ONLY - NO HTTP ENDPOINT)
  startUserAutomationChain:
    handler: build/automation/A_startUserAutomationChain.handler
    package:
      patterns:
        - "!build/**"
        - "build/automation/A_startUserAutomationChain.mjs"
        - "package.json"
    events:
      - schedule:
          # Cron is interpreted in the timezone below (local wall-clock time).
          method: scheduler
          timezone: Asia/Jerusalem
          rate: cron(0 10 ? * SUN,MON,TUE,WED,THU *)
          description: "10:00 Israel time, Sun-Thu"
          enabled: true

  # CRITICAL: Do not modify selenium automation functions - they are working after hours of fixing!

  # Non-selenium automation function
  refreshTokens:
    handler: build/automation/B_refreshTokens.handler
    package:
      patterns:
        - "!build/**"
        - "build/automation/B_refreshTokens.mjs"
        - "package.json"
    # No HTTP events - only called by Step Functions

  # SELENIUM AUTOMATION FUNCTIONS - DO NOT MODIFY CONFIGURATION!
  woltBuyGift:
    image:
      name: woltflow-selenium-image
      command: ["build/automation/C_woltBuyGift.handler"]
    memorySize: 1536
    ephemeralStorageSize: 1536
    timeout: 300
    # No HTTP events - only called by Step Functions

# AWS Resources Configuration
resources:
  Resources:
    # ================================
    # S3 BUCKETS CONFIGURATION
    # ================================

    # S3 Bucket for Client Files (React Vite Build)
    # This bucket will store the compiled React application files
    # Stage-specific:
    ClientFilesBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${env:S3_CLIENT_BUCKET_NAME}
        # Enable public read access for static website hosting
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        # Configure for static website hosting
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html # SPA routing support
        # Enable versioning for better deployment management
        VersioningConfiguration:
          Status: Enabled
        # Lifecycle configuration to manage costs
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldVersions
              Status: Enabled
              NoncurrentVersionExpirationInDays: 30
        # CORS configuration for web access
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: [GET, HEAD]
              AllowedOrigins: ["*"]
              MaxAge: 3600

    # S3 Bucket Policy for Client Files - Allow CloudFront and public read access
    ClientFilesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: ClientFilesBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:aws:s3:::"
                      - Ref: ClientFilesBucket
                      - "/*"

    # S3 Bucket for Assets/Images
    # This bucket will store application assets like images, documents, etc.
    # Stage-specific:
    AssetsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${env:S3_ASSETS_BUCKET_NAME}
        # Enable public read access for assets
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false
        # Enable versioning
        VersioningConfiguration:
          Status: Enabled
        # Lifecycle configuration for automatic cleanup
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldVersions
              Status: Enabled
              NoncurrentVersionExpirationInDays: 30
            - Id: DeleteExportFiles
              Status: Enabled
              Prefix: exports/ # Use Prefix directly, not under Filter
              ExpirationInDays: 1 # Delete export ZIP files after 24 hours (minimum allowed)
            # - Id: DeleteScreenshots
            #   Status: Enabled
            #   Filter:
            #     Prefix: images/
            #   ExpirationInDays: 90 # Keep screenshots for 90 days (matches privacy policy)
        # CORS configuration for cross-origin requests
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: [GET, HEAD, PUT, POST, DELETE]
              AllowedOrigins: ["*"]
              MaxAge: 3600

    # S3 Bucket Policy for Assets - Allow CloudFront and public read access
    AssetsBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket:
          Ref: AssetsBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Sid: PublicReadGetObject
              Effect: Allow
              Principal: "*"
              Action: s3:GetObject
              Resource:
                - Fn::Join:
                    - ""
                    - - "arn:aws:s3:::"
                      - Ref: AssetsBucket
                      - "/*"

    # ================================
    # CLOUDFRONT DISTRIBUTION
    # ================================

    # CloudFront Distribution - CDN for global content delivery
    # Combines API Gateway, client files, and assets under one domain
    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          # Description for the distribution
          Comment: ${self:custom.distributionComment.${self:provider.stage}}

          # Enable the distribution
          Enabled: true

          # Domain aliases - the custom domain names (stage-specific)
          Aliases:
            - ${env:DOMAIN_NAME_CLOUD}

          # SSL/TLS Certificate configuration
          ViewerCertificate: ${self:custom.viewerCertificate}

          # Default cache behavior for /* - serves React app
          DefaultCacheBehavior:
            TargetOriginId: ClientFilesOrigin
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            # Cache policy for SPA - short cache for HTML, longer for assets
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # Managed-CORS-S3Origin

          # Additional cache behaviors for specific paths
          CacheBehaviors:
            # API Gateway behavior - /api/* routes to API Gateway
            - PathPattern: "/api/*"
              TargetOriginId: ApiGatewayOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
              CachedMethods: [GET, HEAD, OPTIONS]
              Compress: true
              # No caching for API calls
              CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
              OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

            # Assets behavior - /images/* routes to assets bucket
            - PathPattern: "/images/*"
              TargetOriginId: AssetsOrigin
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS]
              CachedMethods: [GET, HEAD, OPTIONS]
              Compress: true
              # Long cache for assets
              CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
              OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # Managed-CORS-S3Origin

          # Origins configuration - where CloudFront fetches content from
          Origins:
            # Origin for React app files (S3 bucket)
            - Id: ClientFilesOrigin
              DomainName:
                Fn::GetAtt:
                  - ClientFilesBucket
                  - RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""

            # Origin for assets/images (S3 bucket)
            - Id: AssetsOrigin
              DomainName:
                Fn::GetAtt:
                  - AssetsBucket
                  - RegionalDomainName
              S3OriginConfig:
                OriginAccessIdentity: ""

            # Origin for API Gateway
            - Id: ApiGatewayOrigin
              DomainName:
                Fn::Sub: "${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
              CustomOriginConfig:
                HTTPPort: 443
                HTTPSPort: 443
                OriginProtocolPolicy: https-only
                OriginSSLProtocols: [TLSv1.2]

          # Error pages configuration for SPA routing
          CustomErrorResponses:
            # Redirect 403/404 to index.html for client-side routing
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 300
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
              ErrorCachingMinTTL: 300

          # Geographic restrictions (optional)
          # Restrictions:
          #   GeoRestriction:
          #     RestrictionType: none

          # Logging configuration (optional)
          # Logging:
          #   Bucket: !Sub "${LoggingBucket}.s3.amazonaws.com"
          #   IncludeCookies: false
          #   Prefix: cloudfront-logs/

          # Price class - use all edge locations for best performance
          PriceClass: PriceClass_All

          # HTTP version
          HttpVersion: http2

          # IPv6 support
          IPV6Enabled: true

    # ================================
    # ROUTE 53 CONFIGURATION
    # ================================

    # Route 53 Record - Points custom domain to CloudFront distribution
    # Creates A records for both dev and prod stages
    Route53Record:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: ${env:HOSTED_ZONE_ID}
        Name: ${env:DOMAIN_NAME_CLOUD}
        Type: A
        # Alias configuration - points to CloudFront distribution
        AliasTarget:
          DNSName:
            Fn::GetAtt:
              - CloudFrontDistribution
              - DomainName
          HostedZoneId: Z2FDTNDATAQYW2 # CloudFront hosted zone ID (global)
          EvaluateTargetHealth: false

    # ================================
    # COGNITO USER POOL
    # ================================

    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-${self:provider.stage}
        # Set to Essentials tier instead of Plus (default)
        # Options: ESSENTIALS (recommended), PLUS (default if not specified), LITE (basic features only)
        UserPoolTier: ESSENTIALS
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Schema:
          - Name: email
            AttributeDataType: String
            Required: true
            Mutable: false
          - Name: name
            AttributeDataType: String
            Required: false
            Mutable: true
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
        EmailConfiguration:
          EmailSendingAccount: COGNITO_DEFAULT
        AccountRecoverySetting:
          RecoveryMechanisms:
            - Name: verified_email
              Priority: 1
        # Advanced Security Mode disabled for ESSENTIALS tier
        # To enable threat protection, upgrade to PLUS tier and set: AdvancedSecurityMode: ENFORCED
        UserPoolAddOns:
          AdvancedSecurityMode: OFF

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-${self:provider.stage}-client
        UserPoolId:
          Ref: CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_SRP_AUTH
        PreventUserExistenceErrors: ENABLED
        EnableTokenRevocation: true
        AccessTokenValidity: 1 # 1 hour
        IdTokenValidity: 1 # 1 hour
        RefreshTokenValidity: 30 # 30 days
        TokenValidityUnits:
          AccessToken: hours
          IdToken: hours
          RefreshToken: days
        ReadAttributes:
          - email
          - name
          - email_verified
        WriteAttributes:
          - email
          - name

  Outputs:
    CognitoUserPoolId:
      Description: Cognito User Pool ID
      Value:
        Ref: CognitoUserPool
      Export:
        Name: ${self:service}-${self:provider.stage}-UserPoolId

    CognitoClientId:
      Description: Cognito User Pool Client ID
      Value:
        Ref: CognitoUserPoolClient
      Export:
        Name: ${self:service}-${self:provider.stage}-ClientId

    CognitoIssuer:
      Description: Cognito Token Issuer URL
      Value:
        Fn::Sub: https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}
      Export:
        Name: ${self:service}-${self:provider.stage}-Issuer

    CloudFrontDistributionId:
      Description: CloudFront Distribution ID for cache invalidation
      Value:
        Ref: CloudFrontDistribution
      Export:
        Name: ${self:service}-${self:provider.stage}-CloudFrontDistributionId

    S3ClientBucketName:
      Description: S3 Client Bucket Name for frontend deployment
      Value:
        Ref: ClientFilesBucket
      Export:
        Name: ${self:service}-${self:provider.stage}-S3ClientBucketName
